<!DOCTYPE html>
<html>
<head>
    <title>Confirm Booking</title>
</head>
<body>
    <h2>Confirm Your {{ item_type }} Booking</h2>
    <p>{{ item }}</p>
    <p>Price: ₹{{ item.price }}</p>

    {% if sold_out %}
        <p style="color:red;">Sorry, this is fully booked.</p>
    {% else %}
        <p>Seats available: {{ seats_available }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirm Booking</button>
        </form>
    {% endif %}
</body>
</html>
