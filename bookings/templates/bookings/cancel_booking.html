{% extends 'base.html' %}

{% block title %}Cancel Booking{% endblock %}

{% block content %}
<h2>Cancel Booking #{{ booking.id }}</h2>
<p>{{ booking.booking_type }} — ₹{{ booking.total_price }} — {{ booking.status }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Cancellation</button>
</form>
{% endblock %}
