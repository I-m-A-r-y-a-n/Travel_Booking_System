<!DOCTYPE html>
<html>
<head>
    <title>Choose Payment Method</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f6fa; padding: 40px; display: flex; justify-content: center; }
        .form-card { background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
        .form-card h1 { color: #1e3799; font-size: 1.4em; }
        .form-card p { color: #57606f; }
        .option { display: block; margin: 12px 0; padding: 12px; border: 1px solid #dcdde1; border-radius: 6px; cursor: pointer; }
        .option:hover { border-color: #1e3799; }
        button { margin-top: 20px; padding: 10px 20px; background: #1e3799; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; }
        button:hover { background: #0c2461; }
    </style>
</head>
<body>
    <div class="form-card">
        <h1>Complete Your Payment</h1>
        <p>Booking #{{ booking.id }} — Amount: ₹{{ booking.total_price }}</p>

        <form method="POST" action="{% url 'payments:process_payment' booking.id %}">
            {% csrf_token %}
            <label class="option">
                <input type="radio" name="method" value="CARD" checked> Card
            </label>
            <label class="option">
                <input type="radio" name="method" value="UPI"> UPI
            </label>
            <label class="option">
                <input type="radio" name="method" value="NETBANKING"> Net Banking
            </label>
            <button type="submit">Pay Now</button>
        </form>
    </div>
</body>
</html>
