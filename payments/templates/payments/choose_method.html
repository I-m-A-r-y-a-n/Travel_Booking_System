{% extends 'base.html' %}

{% block title %}Choose Payment Method{% endblock %}

{% block content %}
<h2>Complete Your Payment</h2>
<p>Booking #{{ booking.id }} — Amount: ₹{{ booking.total_price }}</p>

<form method="POST" action="{% url 'payments:process_payment' booking.id %}">
    {% csrf_token %}
    <p><label><input type="radio" name="method" value="CARD" checked> Card</label></p>
    <p><label><input type="radio" name="method" value="UPI"> UPI</label></p>
    <p><label><input type="radio" name="method" value="NETBANKING"> Net Banking</label></p>
    <button type="submit">Pay Now</button>
</form>
{% endblock %}
